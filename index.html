<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0f0f0f">

  <title>Shri Shri</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP HEADER -->
  <header class="topbar">

    <div class="logo" onclick="go('home')">
      <div class="logo-box">SS</div>
      <span>Shri Shri</span>
    </div>

    <div class="search-box">
      <input
        id="q"
        type="search"
        placeholder="Search videos"
        oninput="searchVideos()"
      >
      <span class="search-icon">⌕</span>
    </div>

  </header>


  <!-- CATEGORY BAR -->
  <div class="categories">

    <button onclick="renderHome()">All</button>

    <button onclick="renderShorts()">
      Shorts
    </button>

    <button onclick="renderSubscriptions()">
      Subscriptions
    </button>

    <button onclick="renderHistory()">
      History
    </button>

  </div>


  <!-- MAIN APP -->
  <main id="app">

    <div class="loading">
      Loading Shri Shri...
    </div>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button onclick="go('home')">
      <span>🏠</span>
      <small>Home</small>
    </button>

    <button onclick="go('shorts')">
      <span>🎬</span>
      <small>Shorts</small>
    </button>

    <button onclick="go('upload')" class="upload-nav">
      <span>＋</span>
      <small>Upload</small>
    </button>

    <button onclick="go('subs')">
      <span>🔔</span>
      <small>Subs</small>
    </button>

    <button onclick="go('you')">
      <span>👤</span>
      <small>You</small>
    </button>

  </nav>


  <script src="app.js"></script>

</body>
</html>
